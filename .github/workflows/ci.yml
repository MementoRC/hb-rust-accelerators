# CI workflow using ci-framework reusable workflows
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@v2.9.5
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      actions: read
      checks: write
    with:
      pixi-environment: "ci"
      python-versions: '["3.10", "3.11", "3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-hygiene-check: true
      editable-install: true
      package-path: "."
      allowed-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC"
    secrets: inherit

  rust-build:
    name: "Rust Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.39.5
      - name: Install dependencies
        run: pixi install
      - name: Build and install Rust extension
        run: pixi run rust-build
      - name: Test with Rust acceleration
        run: pixi run test

  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "PRs to main must come from development branch"
            exit 1
          fi

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [checks, rust-build]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.rust-build.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
