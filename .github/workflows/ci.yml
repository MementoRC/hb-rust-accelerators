name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: "Lint & Test (Python only)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.5
      - name: Install dependencies
        run: pixi install
      - name: Install package (pure Python, no Rust)
        run: pixi run uv pip install -e . --no-build-isolation --no-deps
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format-check
      - name: Test (pure Python fallback)
        run: pixi run test

  rust-build:
    name: "Rust Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.5
      - name: Install dependencies
        run: pixi install
      - name: Build and install Rust extension
        run: pixi run rust-build
      - name: Test with Rust acceleration
        run: pixi run test

  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "PRs to main must come from development branch"
            exit 1
          fi

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [lint-and-test, rust-build]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ] || [ "${{ needs.rust-build.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
